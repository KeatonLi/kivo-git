name: Release VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve version
        id: version
        run: node -e "console.log('tag=v'+require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.found == 'false'
        run: npm ci
      - if: steps.existing.outputs.found == 'false'
        name: Verify changelog contains version
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: node -e "const fs=require('fs'); if (!fs.readFileSync('CHANGELOG.md','utf8').includes('## '+process.env.VERSION.slice(1))) throw new Error('Version missing from changelog')"
      - if: steps.existing.outputs.found == 'false'
        run: npm run package
      - name: Create checksum
        if: steps.existing.outputs.found == 'false'
        run: sha256sum kivo-git-*.vsix > kivo-git-${{ steps.version.outputs.tag }}.vsix.sha256
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.found == 'false'
        with:
          name: idea-git-${{ steps.version.outputs.tag }}
          path: |
            kivo-git-*.vsix
            kivo-git-*.vsix.sha256
      - name: Publish GitHub Release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "IdeaGit $TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" kivo-git-*.vsix kivo-git-*.vsix.sha256 \
            --title "Kivo Git $TAG" --generate-notes $prerelease
