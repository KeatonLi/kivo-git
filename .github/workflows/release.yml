name: Release VSIX

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kivo-git-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve version
        id: version
        run: node -e "console.log('tag=v'+require('./package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Verify release integrity checks
        run: node --test scripts/release-integrity.test.mjs scripts/release-gate.test.mjs
      - name: Verify CI commit is still current
        id: freshness
        run: |
          set -euo pipefail
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          node scripts/check-release-gate.mjs "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$main_head" | tee -a "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/{owner}/{repo}/releases/tags/$TAG" > release.json 2> release-error.txt; then
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "Release tag is missing or could not be checked. Investigate and use a new version; existing releases are immutable." >&2
              exit 1
            fi
            mkdir -p existing-release
            version="${TAG#v}"
            vsix="kivo-git-$version.vsix"
            checksum="kivo-git-$TAG.vsix.sha256"
            gh release download "$TAG" --pattern "$vsix" --pattern "$checksum" --dir existing-release
            unzip -p "existing-release/$vsix" extension/package.json > existing-release/manifest.json
            node scripts/check-existing-release.mjs release.json package.json existing-release
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Existing release is complete and consistent; leaving it unchanged."
          else
            if ! grep -Fq '(HTTP 404)' release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            # A tag without a complete release is not safe to reuse: the build
            # may have failed after publishing the tag, or the tag may point to
            # a different commit. Use a new version and investigate manually.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
            if [[ "$status" != 2 ]]; then
              echo "Release tag already exists or could not be checked. Investigate and use a new version; existing releases are immutable." >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.existing.outputs.publish == 'true'
        run: npm ci
      - if: steps.existing.outputs.publish == 'true'
        name: Verify changelog contains version
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: node -e "const fs=require('fs'); if (!fs.readFileSync('CHANGELOG.md','utf8').includes('## '+process.env.VERSION.slice(1))) throw new Error('Version missing from changelog')"
      - if: steps.existing.outputs.publish == 'true'
        name: Verify Extension Development Host entry points
        run: xvfb-run -a npm run test:extension
      - if: steps.existing.outputs.publish == 'true'
        name: Install browser-test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - if: steps.existing.outputs.publish == 'true'
        name: Install Chromium for Webview E2E
        run: npx playwright install --with-deps chromium
      - if: steps.existing.outputs.publish == 'true'
        name: Verify Commit and History interactions
        run: npm run test:webview
      - if: steps.existing.outputs.publish == 'true'
        run: npm run package
      - name: Create checksum
        if: steps.existing.outputs.publish == 'true'
        run: sha256sum kivo-git-*.vsix > kivo-git-${{ steps.version.outputs.tag }}.vsix.sha256
      - uses: actions/upload-artifact@v4
        if: steps.existing.outputs.publish == 'true'
        with:
          name: kivo-git-${{ steps.version.outputs.tag }}
          path: |
            kivo-git-*.vsix
            kivo-git-*.vsix.sha256
      - name: Publish GitHub Release
        if: steps.existing.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          main_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if ! node scripts/check-release-gate.mjs "$GITHUB_EVENT_PATH" "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$main_head" | grep -Fxq 'current=true'; then
            echo "main advanced after CI; refusing to publish this stale commit." >&2
            exit 1
          fi
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" -m "Kivo Git $TAG"
          git push origin "$TAG"
          gh release create "$TAG" kivo-git-*.vsix kivo-git-*.vsix.sha256 \
            --verify-tag --title "Kivo Git $TAG" --generate-notes $prerelease
