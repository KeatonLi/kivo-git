name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Install browser-test runtime
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for Webview E2E
        run: npx playwright install --with-deps chromium
      - run: npm run test:webview
      - run: npm run compile
      - run: xvfb-run -a npm run test:extension
